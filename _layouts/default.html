<!doctype html>
<html>
  {% include head.html %}
  <body class="layout-{{ page.layout }}">
    <header class="site-header">
      <div class="site-header-left">
        <a href="{{ site.github.url }}/" class="site-title">{{ site.title }}</a>
      </div>
      <nav class="menu-list">
        {% for item in site.data.settings.menu %}
          <a href="{{ site.github.url }}/{{ item.url }}" class="menu-link{% if page.url contains item.url %} menu-link--active{% endif %}">{{ item.name }}</a>
        {% endfor %}
      </nav>
    </header>
    <main class="content-wrapper">
      {{ content }}
    </main>
  </body>
</html>
