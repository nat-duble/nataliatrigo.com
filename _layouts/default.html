<!doctype html>
<html>
  {% include head.html %}
  <body class="layout-{{ page.layout }}">
    <div class="page-wrapper">
      <aside class="sidebar">
        {% include header.html %}
      </aside>
      <div class="main-column">
        <main class="content-wrapper">
          {{ content }}
        </main>
        {% unless page.layout == "home" %}
          {% include footer.html %}
        {% endunless %}
      </div>
    </div>
  </body>
</html>
