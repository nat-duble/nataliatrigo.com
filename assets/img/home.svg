<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="wallGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ede9e2"/>
      <stop offset="100%" stop-color="#e4e0d8"/>
    </linearGradient>
    <radialGradient id="windowLight" cx="42%" cy="45%" r="55%" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f7eedc" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#ede9e2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lampLight" cx="900" cy="300" r="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f5e8c8" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ede9e2" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background wall -->
  <rect width="1200" height="800" fill="url(#wallGrad)"/>

  <!-- Window ambient light wash -->
  <rect width="1200" height="800" fill="url(#windowLight)"/>

  <!-- Lamp ambient light -->
  <ellipse cx="900" cy="340" rx="230" ry="170" fill="url(#lampLight)"/>

  <!-- Floor / desk area -->
  <rect y="560" width="1200" height="240" fill="#dedad3"/>

  <!-- Desk surface edge -->
  <rect y="554" width="1200" height="14" fill="#1a1a1a"/>

  <!-- ── WINDOW ── -->
  <!-- Shadow behind window -->
  <rect x="226" y="36" width="452" height="352" fill="#c8c4bc" opacity="0.3"/>
  <!-- Window outer frame -->
  <rect x="220" y="30" width="452" height="352" fill="#f0ede6" stroke="#1a1a1a" stroke-width="4"/>
  <!-- Pane glass tint -->
  <rect x="222" y="32" width="224" height="172" fill="#dce8ed" opacity="0.35"/>
  <rect x="446" y="32" width="224" height="172" fill="#dce8ed" opacity="0.28"/>
  <rect x="222" y="204" width="224" height="176" fill="#dce8ed" opacity="0.22"/>
  <rect x="446" y="204" width="224" height="176" fill="#dce8ed" opacity="0.18"/>
  <!-- Vertical mullion -->
  <rect x="444" y="30" width="8" height="352" fill="#1a1a1a"/>
  <!-- Horizontal transom -->
  <rect x="220" y="202" width="452" height="8" fill="#1a1a1a"/>
  <!-- Window sill -->
  <rect x="210" y="382" width="472" height="16" fill="#1a1a1a"/>

  <!-- Light lines through window (very subtle) -->
  <line x1="280" y1="32" x2="240" y2="554" stroke="#f5ead0" stroke-width="18" opacity="0.18"/>
  <line x1="380" y1="32" x2="330" y2="554" stroke="#f5ead0" stroke-width="12" opacity="0.12"/>

  <!-- ── DESK LAMP ── -->
  <!-- Base -->
  <ellipse cx="980" cy="562" rx="52" ry="12" fill="#2a2a2a"/>
  <rect x="974" y="430" width="12" height="134" fill="#1a1a1a"/>
  <!-- Arm elbow -->
  <rect x="860" y="294" width="130" height="10" fill="#1a1a1a" transform="rotate(-25 860 294)"/>
  <!-- Shade -->
  <polygon points="840,230 920,230 940,290 820,290" fill="#1a1a1a"/>
  <!-- Shade highlight -->
  <line x1="845" y1="238" x2="930" y2="238" stroke="#555" stroke-width="1.5" opacity="0.5"/>

  <!-- ── BOOKS – stacked on left ── -->
  <!-- Lying stack -->
  <rect x="60" y="500" width="180" height="26" rx="1" fill="#1a1a1a"/>
  <rect x="66" y="474" width="168" height="26" rx="1" fill="#6b6b6b"/>
  <rect x="58" y="448" width="184" height="26" rx="1" fill="#3a3a3a"/>
  <rect x="70" y="422" width="160" height="26" rx="1" fill="#888"/>
  <!-- Book spine lines -->
  <line x1="60" y1="500" x2="240" y2="500" stroke="#333" stroke-width="0.5"/>
  <line x1="66" y1="474" x2="234" y2="474" stroke="#999" stroke-width="0.5"/>

  <!-- Standing books right of stack -->
  <rect x="260" y="484" width="22" height="72" rx="1" fill="#1a1a1a"/>
  <rect x="284" y="490" width="18" height="66" rx="1" fill="#aaa"/>
  <rect x="304" y="487" width="24" height="69" rx="1" fill="#444"/>
  <rect x="330" y="492" width="16" height="64" rx="1" fill="#c4924a"/>
  <rect x="348" y="488" width="20" height="68" rx="1" fill="#777"/>
  <rect x="370" y="494" width="15" height="62" rx="1" fill="#2a2a2a"/>

  <!-- ── PAPERS ── -->
  <rect x="540" y="520" width="260" height="34" rx="1" fill="#faf8f4" transform="rotate(-1.5 670 537)" stroke="#d0ccc6" stroke-width="0.5"/>
  <rect x="548" y="514" width="255" height="34" rx="1" fill="#fdf9f5" transform="rotate(0.8 675 531)" stroke="#d8d4ce" stroke-width="0.5"/>
  <rect x="544" y="508" width="258" height="34" rx="1" fill="#fff" transform="rotate(-0.5 673 525)" stroke="#e0dcd6" stroke-width="0.5"/>
  <!-- Handwriting lines -->
  <line x1="562" y1="518" x2="770" y2="516" stroke="#ccc" stroke-width="1"/>
  <line x1="562" y1="524" x2="755" y2="523" stroke="#ccc" stroke-width="1"/>
  <line x1="562" y1="530" x2="768" y2="529" stroke="#ccc" stroke-width="1"/>
  <line x1="562" y1="536" x2="740" y2="535" stroke="#ccc" stroke-width="1"/>

  <!-- ── PEN ── -->
  <line x1="556" y1="548" x2="700" y2="552" stroke="#2a2a2a" stroke-width="3.5" stroke-linecap="round"/>
  <polygon points="700,550 714,548 700,554" fill="#c4924a"/>
  <rect x="548" y="546" width="12" height="7" rx="3" fill="#1a1a1a"/>

  <!-- ── COFFEE CUP ── -->
  <!-- Saucer -->
  <ellipse cx="840" cy="556" rx="44" ry="10" fill="#d8d3cb"/>
  <!-- Cup body -->
  <path d="M810,520 Q808,556 840,556 Q872,556 870,520 Z" fill="#c4924a"/>
  <!-- Cup top ellipse -->
  <ellipse cx="840" cy="520" rx="30" ry="8" fill="#d4a96e"/>
  <!-- Cup handle -->
  <path d="M870,528 Q892,528 892,538 Q892,548 870,548" fill="none" stroke="#c4924a" stroke-width="5" stroke-linecap="round"/>
  <!-- Coffee surface -->
  <ellipse cx="840" cy="520" rx="24" ry="6" fill="#7a4e2a"/>
  <!-- Steam -->
  <path d="M828,514 Q831,504 828,494" fill="none" stroke="#ccc8c0" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <path d="M840,512 Q843,500 840,490" fill="none" stroke="#ccc8c0" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <path d="M852,514 Q855,504 852,494" fill="none" stroke="#ccc8c0" stroke-width="2" stroke-linecap="round" opacity="0.7"/>

  <!-- ── SMALL PLANT on windowsill ── -->
  <rect x="636" y="374" width="38" height="28" rx="2" fill="#5a5752"/>
  <ellipse cx="655" cy="378" rx="6" ry="2" fill="#4a4542"/>
  <!-- Leaves -->
  <ellipse cx="648" cy="364" rx="7" ry="14" fill="#7a8e70" transform="rotate(-18 648 364)"/>
  <ellipse cx="660" cy="360" rx="7" ry="15" fill="#8a9e80" transform="rotate(12 660 360)"/>
  <ellipse cx="654" cy="358" rx="5" ry="12" fill="#6a7e62" transform="rotate(-4 654 358)"/>

  <!-- ── SMALL FRAMED ARTWORK on wall ── -->
  <rect x="850" y="60" width="140" height="180" fill="#f0ede6" stroke="#1a1a1a" stroke-width="3"/>
  <rect x="858" y="68" width="124" height="164" fill="none" stroke="#ccc" stroke-width="1"/>
  <!-- Abstract marks inside frame -->
  <line x1="880" y1="110" x2="950" y2="90" stroke="#1a1a1a" stroke-width="1.5" opacity="0.4"/>
  <line x1="875" y1="130" x2="960" y2="120" stroke="#1a1a1a" stroke-width="1" opacity="0.3"/>
  <ellipse cx="920" cy="160" rx="25" ry="35" fill="none" stroke="#1a1a1a" stroke-width="1.5" opacity="0.35"/>
  <line x1="875" y1="200" x2="965" y2="195" stroke="#1a1a1a" stroke-width="1" opacity="0.25"/>
  <line x1="880" y1="215" x2="950" y2="210" stroke="#1a1a1a" stroke-width="1" opacity="0.2"/>

  <!-- ── WAINSCOTING / baseboard ── -->
  <rect y="760" width="1200" height="40" fill="#d0ccc5"/>
  <rect y="756" width="1200" height="6" fill="#1a1a1a"/>
</svg>
